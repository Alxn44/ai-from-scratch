[project]
name = "ia-desde-cero-ia"
version = "3.0.0"
description = "Ontologia y agente del curso. Todo lo que es IA vive aqui; TypeScript se queda con backend y frontend."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "httpx>=0.28",
  "pydantic>=2.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.8"]

[project.scripts]
ia-verifica = "ia.verifica:main"
ia-exporta = "ia.ontologia.exporta:main"
ia-prueba-aislamiento = "ia.ontologia.grafo:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ia"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Lo que se enciende esta elegido, no heredado: E/F es lo basico, UP mantiene la
# sintaxis al dia del target, RUF y B atrapan errores de verdad (mutables por
# defecto, except sin re-lanzar), I ordena imports. No se enciende ANN ni D:
# exigir anotaciones y docstrings en todo produce ruido que se ignora.
select = ["E", "F", "I", "UP", "B", "RUF"]
ignore = ["E501"]   # el largo lo pone line-length, no una regla aparte
