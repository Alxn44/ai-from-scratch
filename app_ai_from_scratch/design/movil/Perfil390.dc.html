<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    /* Tokens copiados literalmente de web/src/lib/theme-css.ts. Sin redondear,
       sin aproximar: el artboard tiene que ser indistinguible de la app. */
    :root{
      --f:-apple-system,'SF Pro Display','SF Pro Text','Helvetica Neue',system-ui,sans-serif;
      --m:ui-monospace,'SF Mono',SFMono-Regular,Menlo,monospace;
      --bg:#000;--panel:#0B0B0C;
      --l1:#fff;--l2:rgba(235,235,245,.62);--l3:rgba(235,235,245,.50);
      --hair:rgba(84,84,88,.46);--hair2:rgba(84,84,88,.16);--fill:rgba(120,120,128,.22);
      --ac:#0A84FF;--ac-solid:#0A6CFF;--ok:#30D158;--or:#FF9F0A;--rd:#FF453A;
      --btn-bg:#fff;--btn-fg:#000;--on-ac:#fff;
    }
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);font-family:var(--f);color:var(--l1);-webkit-font-smoothing:antialiased}
    a{color:var(--ac);text-decoration:none}
    a:hover{color:#409CFF}
    /* Rampa tipografica de web/src/layouts/App.astro, mismas declaraciones. */
    .lbl{font:500 10px/1 var(--m);letter-spacing:.18em;text-transform:uppercase;color:var(--l3);margin:0}
    .eb{font:600 10px/1 var(--m);letter-spacing:.22em;text-transform:uppercase;color:var(--ac);margin:0}
    .h1{font:700 34px/1.06 var(--f);letter-spacing:-.035em;margin:0}
    .h2{font:700 21px/1.16 var(--f);letter-spacing:-.028em;margin:0}
    .h3{font:600 15px/1.3 var(--f);letter-spacing:-.01em;margin:0}
    .p{font:400 16px/1.5 var(--f);color:var(--l2);margin:0}
    .s{font:400 13px/1.45 var(--f);color:var(--l3);margin:0}
    .num{font-variant-numeric:tabular-nums}
    .card{border:1px solid var(--hair2);padding:22px}
    .btn{height:44px;display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:0 20px;border:0;border-radius:6px;background:var(--btn-bg);color:var(--btn-fg);font:600 11px/1 var(--m);letter-spacing:.1em;text-transform:uppercase;font-family:var(--m)}
    .btn.ghost{background:transparent;border:1px solid var(--hair);color:var(--l1)}
    .chip{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 14px;border:1px solid var(--hair);background:transparent;color:var(--l1);font:500 14px/1.2 var(--m)}
    .chip[data-on]{border-color:var(--ac);background:rgba(10,132,255,.18)}
    .input{height:44px;width:100%;padding:0 14px;background:var(--fill);border:1px solid var(--hair2);color:var(--l1);font:400 15px/1 var(--f)}
    .bar{height:4px;background:rgba(120,120,128,.20)}
    .barfill{height:4px;background:var(--l1)}
    .nav{height:44px;display:flex;align-items:center;gap:11px;padding:0 16px;color:var(--l3);font:500 11px/1 var(--m);letter-spacing:.14em;text-transform:uppercase;border-left:2px solid transparent}
    .nav[aria-current]{color:var(--l1);background:var(--fill);border-left-color:var(--ac)}
    .seg{display:flex;border:1px solid var(--hair2)}
    .segb{height:30px;padding:0 10px;background:transparent;border:0;border-right:1px solid var(--hair2);color:var(--l3);font:600 10px/1 var(--m);letter-spacing:.12em;text-transform:uppercase}
    .segb:last-child{border-right:0}
    .segb[aria-pressed="true"]{background:var(--ac-solid);color:var(--on-ac)}
    .tblhead{font:500 10px/1 var(--m);letter-spacing:.16em;text-transform:uppercase;color:var(--l3)}
    /* PROPUESTA. Lo de aqui abajo no existe todavia en la app: es lo que hay que
       aprobar. Cada regla lleva por que. */
    /* .segb mide 30px de alto en la app. En un dedo eso incumple el suelo de
       44px que .btn, .chip y .input ya respetan. En movil sube a 44. */
    .segb.touch{height:44px;padding:0 16px;font-size:11px}
    /* Cabecera de dos filas: fila 1 hamburguesa + miga, fila 2 el slot topbar.
       Hoy la fila 2 se borra con display:none y con ella el conmutador de /chat
       y el marcador de /examen. */
    .head{border-bottom:1px solid var(--hair2);background:var(--bg)}
    .head-r1{height:56px;display:flex;align-items:center;gap:4px;padding:0 8px 0 4px}
    .head-r2{min-height:52px;display:flex;align-items:center;gap:10px;padding:0 14px 10px;border-top:1px solid var(--hair2);padding-top:10px}
    .tap{width:44px;height:44px;flex:none;display:grid;place-items:center;color:var(--l3);background:none;border:0}
    .pad{padding:18px 14px 32px;display:flex;flex-direction:column;gap:22px}
    /* La lista de lecciones en movil: dos filas por leccion en vez de cinco
       columnas. #, texto y estado en la primera; labs y contador debajo. */
    .row-m{display:grid;grid-template-columns:32px 1fr auto;gap:8px 12px;align-items:center;padding:12px 4px;border-bottom:1px solid var(--hair2)}
    .est{display:inline-flex;align-items:center;height:26px;padding:0 10px;font:500 10px/1 var(--m);letter-spacing:.12em;text-transform:uppercase}
    /* Carril de atajos de /chat: tira horizontal sobre el compositor, que es
       donde sirven, en vez de ocho botones apilados debajo del hilo. */
    .rail{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
    .rail::-webkit-scrollbar{display:none}
    .rail .btn{flex:none;height:38px;padding:0 14px;font-size:10px}
  </style>
</helmet>
<!-- perfil.astro:28 — repeat(4,minmax(0,1fr)) con gap:22. A 390:
        (362 - 3x22) / 4 = 74 px por tarjeta
        .card lleva padding:22px -> 30 px de contenido
        dentro hay numeros a font:700 34px («3 / 12» pide ~90 px)
     minmax(0,...) evita que la PAGINA desborde, pero el numero desborda su
     propia tarjeta. Cero media queries en el fichero.
     PROPUESTA: 2 columnas por debajo de 900, 4 por encima de 1180. -->
<div style="min-height:100%;background:var(--bg);padding:18px 14px;display:flex;flex-direction:column;gap:22px">

  <div style="display:flex;align-items:center;gap:14px">
    <div style="width:52px;height:52px;flex:none;border:1px solid var(--hair);display:grid;place-items:center;font:600 16px/1 var(--m)">AP</div>
    <div style="min-width:0">
      <h1 class="h1" style="font-size:24px">Alejandro Padron</h1>
      <p class="s" style="color:var(--l2);margin-top:5px">alejandro@ejemplo.com &middot; comprado</p>
    </div>
  </div>

  <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px">
    <div class="card" style="padding:18px;display:flex;flex-direction:column;gap:10px">
      <p class="lbl">LECCIONES</p>
      <div class="num" style="font:700 30px/1 var(--f);letter-spacing:-.04em">3 / 12</div>
      <div class="bar"><div class="barfill" style="width:25%"></div></div>
    </div>
    <div class="card" style="padding:18px;display:flex;flex-direction:column;gap:10px">
      <p class="lbl">LABS</p>
      <div class="num" style="font:700 30px/1 var(--f);letter-spacing:-.04em">9 / 36</div>
      <div class="bar"><div class="barfill" style="width:25%"></div></div>
    </div>
    <div class="card" style="padding:18px;display:flex;flex-direction:column;gap:10px">
      <p class="lbl">IDIOMA</p>
      <div style="font:700 18px/1.2 var(--f)">Espanol &middot; auto</div>
      <p class="s">Se cambia en Ajustes.</p>
    </div>
    <div class="card" style="padding:18px;display:flex;flex-direction:column;gap:10px">
      <p class="lbl">CERTIFICADO</p>
      <div class="num" style="font:700 18px/1.2 var(--f);color:var(--l3)">AL 100%</div>
      <p class="s">Se emite al terminar.</p>
    </div>
  </div>

  <!-- perfil.astro:38 — repeat(6,minmax(0,1fr)) da 50 px por celda a 390.
       Para 12 insignias de dos digitos aguanta; se deja en 6. -->
  <div style="display:flex;flex-direction:column;gap:12px">
    <p class="lbl">AVANCE POR LECCION</p>
    <div style="display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px">
      <span class="num" style="height:44px;display:grid;place-items:center;border:1px solid var(--ok);background:rgba(48,209,88,.14);color:var(--ok);font:600 13px/1 var(--m)">01</span>
      <span class="num" style="height:44px;display:grid;place-items:center;border:1px solid var(--ok);background:rgba(48,209,88,.14);color:var(--ok);font:600 13px/1 var(--m)">02</span>
      <span class="num" style="height:44px;display:grid;place-items:center;border:1px solid var(--ok);background:rgba(48,209,88,.14);color:var(--ok);font:600 13px/1 var(--m)">03</span>
      <span class="num" style="height:44px;display:grid;place-items:center;border:1px solid var(--ac);background:rgba(10,132,255,.14);color:var(--ac);font:600 13px/1 var(--m)">04</span>
      <span class="num" style="height:44px;display:grid;place-items:center;border:1px solid var(--hair);color:var(--l3);font:600 13px/1 var(--m)">05</span>
      <span class="num" style="height:44px;display:grid;place-items:center;border:1px solid var(--hair);color:var(--l3);font:600 13px/1 var(--m)">06</span>
      <span class="num" style="height:44px;display:grid;place-items:center;border:1px solid var(--hair);color:var(--l3);font:600 13px/1 var(--m)">07</span>
      <span class="num" style="height:44px;display:grid;place-items:center;border:1px solid var(--hair);color:var(--l3);font:600 13px/1 var(--m)">08</span>
      <span class="num" style="height:44px;display:grid;place-items:center;border:1px solid var(--hair);color:var(--l3);font:600 13px/1 var(--m)">09</span>
      <span class="num" style="height:44px;display:grid;place-items:center;border:1px solid var(--hair);color:var(--l3);font:600 13px/1 var(--m)">10</span>
      <span class="num" style="height:44px;display:grid;place-items:center;border:1px solid var(--hair);color:var(--l3);font:600 13px/1 var(--m)">11</span>
      <span class="num" style="height:44px;display:grid;place-items:center;border:1px solid var(--hair);color:var(--l3);font:600 13px/1 var(--m)">12</span>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
