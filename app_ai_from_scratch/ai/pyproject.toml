[project]
name = "course-ai"
version = "3.0.0"
description = "Course ontology and agent. Everything that is AI lives here; TypeScript keeps the backend and the frontend."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "httpx>=0.28",
  "pydantic>=2.9",
  # Broker client for course_ai/bus.py. aio-pika and not pika: this service is
  # async everywhere else (FastAPI + httpx), and a blocking client inside an event
  # loop is a stall nobody sees until the chat turn behind it times out. It is
  # imported lazily, so a process with no AMQP_URL never loads it and the tests do
  # not need a broker to run.
  "aio-pika>=10.0.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.8"]

[project.scripts]
# The ai-worker container's command. Same image as the service, different
# entrypoint — see the container table in docs/ARCHITECTURE.md.
ai-worker = "course_ai.worker:main"
ai-verify = "course_ai.verify:main"
ai-export = "course_ai.ontology.export:main"
ai-doc = "course_ai.ontology.render:main"
ai-prove-isolation = "course_ai.ontology.graph:main"
# The concept-map drift gate. It is a console script for the same reason the
# others are: `ai-verify` runs it as a STEP, so `pnpm verify` goes red on a map
# that no longer agrees with the lesson index Node serves.
ai-check-concepts = "course_ai.retrieval.check:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/course_ai"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# What is switched on was chosen, not inherited: E/F is the baseline, UP keeps the
# syntax current with the target, RUF and B catch real mistakes (mutable defaults,
# an `except` that never re-raises), I sorts imports. ANN and D stay off: demanding
# annotations and docstrings everywhere produces noise that gets ignored.
select = ["E", "F", "I", "UP", "B", "RUF"]
ignore = ["E501"]   # length is set by line-length, not by a separate rule
