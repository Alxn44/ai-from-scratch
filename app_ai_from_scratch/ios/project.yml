# Generado con xcodegen: `xcodegen generate` en esta carpeta.
#
# El .xcodeproj NO se versiona. Es un fichero que Xcode reescribe solo, con
# UUIDs que cambian en cada guardado, y dos personas tocando el proyecto
# producen un conflicto que no se puede leer ni resolver a mano. Este YAML es
# la fuente y el .xcodeproj es un artefacto, igual que api/src/ontologia.json.
name: IAdesdeCero

options:
  bundleIdPrefix: io.alpadev
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    # Equipo personal de Apple ID (Alejandro padron). Con esto el build en
    # dispositivo firma solo; sin esto pide interaccion en Xcode.
    DEVELOPMENT_TEAM: JCFF679Z97
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  IAdesdeCero:
    type: application
    platform: iOS
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.alpadev.iadesdecero
        # El icono es la marca del loader: cuadro blanco, IA en mono negra.
        # Generado en Sources/Assets.xcassets desde scripts (Swift/AppKit),
        # 1024x1024 sin alfa, que es lo que exige App Store.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: IA desde cero
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1,2"
