<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="IA desde cero">
  <!-- La marca del loader (index.astro, .lg), la misma del icono de la app iOS:
       placa negra, cuadro de BORDE blanco al 4% del lado y «IA» en 700 al 46%
       del lado con tracking -.02em. Sustituye al monograma AD de Alpadev: el
       producto se llama «IA desde cero» y su pestana debe decir eso, no la
       marca personal del autor.

       El cuadro mide 56 sobre 64 (margen 4): una pestana no recorta esquinas
       como iOS, y a 16px reales el margen grande del icono de app dejaria las
       letras en ~3px. Misma construccion, recorte del contenedor.

       El texto va en la pila de sistema (la pila f del tema): las formas varian un
       pelo entre SO, exactamente igual que en toda la web, que se rotula con
       esa misma pila. -->
  <rect width="64" height="64" fill="#000000"/>
  <rect x="5.12" y="5.12" width="53.76" height="53.76" fill="none" stroke="#FFFFFF" stroke-width="2.24"/>
  <text x="32.26" y="32" text-anchor="middle" dominant-baseline="central"
        font-family="-apple-system,'SF Pro Display','SF Pro Text','Helvetica Neue',system-ui,sans-serif"
        font-weight="700" font-size="25.76" letter-spacing="-0.52" fill="#FFFFFF">IA</text>
</svg>
