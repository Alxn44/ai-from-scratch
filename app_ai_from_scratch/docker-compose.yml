# Cuatro contenedores: base, IA, backend y frontend. Un solo comando:
#   docker compose up --build
#
# La IA es un servicio aparte desde v3: el bucle del agente y la ontologia estan
# en Python (ai/). Las llaves de modelo las tiene ESE contenedor, no la API — asi
# el proceso que habla con internet no es el que tiene la base delante.
# El nombre del proyecto se FIJA. Compose lo deriva del nombre de la carpeta, asi
# que al mover el proyecto a app_ai_from_scratch/ paso de `aifromscratch` a
# `app_ai_from_scratch`: creo una base NUEVA Y VACIA e intento bindear 5432, que
# ya tenia la vieja. `pnpm dev` murio diciendo "¿Esta corriendo Docker?" mientras
# los datos (11 usuarios, 72 intentos) seguian intactos en el volumen viejo.
# Con el nombre fijado, mover la carpeta ya no cambia de base.
name: aifromscratch

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: curso
      # No default, and never the username again. With password == username,
      # one connection hands over users.pass_hash, users.email, payments.raw and
      # labs.solution. Compose refuses to start rather than ship that.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run scripts/keys.sh first}
      POSTGRES_DB: curso
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Loopback only. Publishing on 0.0.0.0 exposed the database to the whole
      # LAN, and on Linux that cannot be firewalled off after the fact: Docker
      # writes DNAT rules that are evaluated BEFORE the host INPUT chain, so a
      # host-level DROP on 5432 never sees the packet. The reason this port is
      # published at all is psql from this machine, and 127.0.0.1 covers that.
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U curso -d curso"]
      interval: 3s
      timeout: 3s
      retries: 20
    # THE FOUR STATEFUL SERVICES NEED THIS AS MUCH AS THE ELEVEN STATELESS ONES,
    # and for six and a half hours they did not have it.
    #
    # The Raspberry Pi rebooted at 14:45 UTC on 2026-08-29. Everything carrying
    # `restart: unless-stopped` -- api, web, data, ia, the workers, the five
    # defence agents -- came back forty-nine seconds later. db, broker,
    # payments-db and messages-db did not, because none of the four declared a
    # policy at all, and `no` is the default.
    #
    # That combination is worse than the whole box staying down. The site kept
    # serving: the landing rendered, TLS was valid, the health endpoint answered.
    # It answered HTTP 400 `data refused auth.user_by_email ... lookup db on
    # 127.0.0.11:53: no such host`. Nobody could log in and nobody could pay,
    # while every external signal said the service was alive. It was found by
    # hand, not by an alarm.
    #
    # `unless-stopped`, not `always`: an operator who deliberately stops a
    # database to take a backup should not have Docker start it again underneath
    # them. A reboot is not that, and this is the case that separates the two.
    restart: unless-stopped

  # Separate persistence boundary for the extractable payments repository.
  # It stores provider payloads and webhook history; the course database sees
  # only idempotent entitlement events and never receives Mercado Pago secrets.
  payments-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: payments
      POSTGRES_PASSWORD: ${PAYMENTS_DB_PASSWORD:?run scripts/keys.sh first}
      POSTGRES_DB: payments
    volumes:
      - paymentsdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payments -d payments"]
      interval: 3s
      timeout: 3s
      retries: 20
    # See db. This one is the reason `/api/payments/estado` answered
    # `{"disponible":false}` after the reboot: checkout was off and the landing
    # never said so.
    restart: unless-stopped

  payments:
    build: ./payments
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "8785"
      DATABASE_URL: postgres://payments:${PAYMENTS_DB_PASSWORD:?run scripts/keys.sh first}@payments-db:5432/payments
      PAYMENTS_SECRET: ${PAYMENTS_SECRET:?run scripts/keys.sh first}
      MP_ACCESS_TOKEN: ${MP_ACCESS_TOKEN:?configure Mercado Pago first}
      MP_WEBHOOK_SECRET: ${MP_WEBHOOK_SECRET:?configure Mercado Pago first}
      MP_PUBLIC_KEY: ${MP_PUBLIC_KEY:-}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:4321}
      ENTITLEMENTS_URL: http://api:8787/api/internal/entitlements
    depends_on:
      payments-db:
        condition: service_healthy
      init:
        condition: service_completed_successfully
    expose: ["8785"]
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:8785/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  # Separate persistence boundary for AI chat. JSONB documents, no person
  # tables, no foreign keys into curso. The API injects userId from the cookie.
  messages-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: messages
      POSTGRES_PASSWORD: ${MESSAGES_DB_PASSWORD:?run scripts/keys.sh first}
      POSTGRES_DB: messages
    volumes:
      - messagesdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5436:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U messages -d messages"]
      interval: 3s
      timeout: 3s
      retries: 20
    # See db. Without it `messages` restart-looped against ENOTFOUND messages-db
    # for six hours, which is `unless-stopped` doing its job for the service that
    # had it, aimed at a host that could never appear.
    restart: unless-stopped

  messages:
    build: ./messages
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "8786"
      DATABASE_URL: postgres://messages:${MESSAGES_DB_PASSWORD:?run scripts/keys.sh first}@messages-db:5432/messages
      MESSAGES_SECRET: ${MESSAGES_SECRET:?run scripts/keys.sh first}
    depends_on:
      messages-db:
        condition: service_healthy
    expose: ["8786"]
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:8786/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # init: applies the schema, then seeds content. Runs ONCE and exits.
  #
  # Both used to happen inside the API process — `migrate()` executed twenty
  # idempotent DDL statements at every boot and the command was
  # `node dist/src/seed.js && node dist/src/server.js`. With one instance that works. With
  # two it is two processes running DDL and two processes seeding the same rows,
  # and "it never broke because we only ever ran one" is not a property to keep
  # while planning to scale.
  #
  # Built from the `migrate` stage because the runtime image installs with --prod
  # and prunes the Prisma CLI.
  # ---------------------------------------------------------------------------
  # broker: the coordination substrate. docs/ARCHITECTURE.md argues at length why there
  # is no separate `orchestrator` service — RabbitMQ IS the orchestrator, and the
  # policy on top of it lives as a library inside the services that run the work.
  #
  # HTTP carries the path a human is waiting on (the chat turn, api <-> ia).
  # Everything else — batch grading, embeddings, the weekly league close, email,
  # exports — goes through here, because nobody is blocked on it and it needs
  # retries, back-pressure and durability.
  # ---------------------------------------------------------------------------
  broker:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: app
      # No default. The database already shipped with password == username once.
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?run scripts/keys.sh first}
    volumes:
      - brokerdata:/var/lib/rabbitmq
    ports:
      # Management and AMQP stay on loopback ONLY. Morpheus runs in the host
      # namespace to inspect real listeners, so it reaches AMQP through this
      # loopback binding; neither endpoint is exposed to the LAN.
      - "127.0.0.1:15672:15672"
      - "127.0.0.1:5672:5672"
    healthcheck:
      # CMD-SHELL, not CMD: the exec form passes `&&` as a literal ARGUMENT, so
      # the first written version failed with `too many arguments` and the service
      # sat in `starting` forever while everything that waits on it stalled. A
      # healthcheck that can never pass is worse than none — the dependency graph
      # deadlocks instead of erroring.
      #
      # check_running alone is not enough: a node with a memory or disk alarm is
      # running and refusing publishes, which looks like a hung producer.
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q check_running && rabbitmq-diagnostics -q check_local_alarms"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 40s
    # See db. The bus going down takes the retry ladder and the dead-letter
    # exchange with it, so work is not merely delayed, it has nowhere to queue.
    restart: unless-stopped

  init:
    build:
      context: .
      dockerfile: api/Dockerfile
      target: migrate
    environment:
      DATABASE_URL: postgres://curso:${POSTGRES_PASSWORD:?run scripts/keys.sh first}@db:5432/curso
      # Prisma loads prisma.config.ts before running migrate deploy. The command
      # does not use the shadow database, but the config requires this variable
      # to exist while it is being evaluated.
      SHADOW_DATABASE_URL: postgres://curso:${POSTGRES_PASSWORD:?run scripts/keys.sh first}@db:5432/curso_shadow
      NODE_ENV: production
      # seed imports the auth KDF to create any explicitly enabled demo account;
      # auth validates its session key at module load even when demo seeding is off.
      JWT_SECRET: ${JWT_SECRET:?run scripts/keys.sh first}
      # Demo accounts stay off unless asked for, and refuse to exist under
      # NODE_ENV=production at all. This used to plant an admin with a password
      # committed to the repository, on every single start.
      SEED_DEMO_USERS: ${SEED_DEMO_USERS:-0}
      SEED_DEMO_PASSWORD: ${SEED_DEMO_PASSWORD:-}
      # One-time production root provisioning. These are deliberately optional:
      # a static credential or hash in a migration would remain readable from
      # Git forever. The release workflow copies them only when both protected
      # Environment secrets exist; the init program then creates the account
      # once and never resets its password on a later deploy.
      BOOTSTRAP_ROOT_USER: ${BOOTSTRAP_ROOT_USER:-}
      BOOTSTRAP_ROOT_PASSWORD: ${BOOTSTRAP_ROOT_PASSWORD:-}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  # The only process in the fleet that holds the database credential.
  #
  # WHY IT EXISTS. api used to open its own pool, which meant an RCE in Node read
  # all twelve tables -- users.pass_hash, payments.raw, labs.solution included.
  # Here the credential lives in one Go binary that speaks a CLOSED CATALOGUE of
  # named operations and has no SQL endpoint at all: statements are assembled from
  # each operation's declared column list, so a wildcard is unreachable rather
  # than rejected. The same RCE now reads the shapes that catalogue declares,
  # scoped to one actor.
  #
  # NO PUBLISHED PORT. Nothing outside the compose network may reach it. api and
  # api-worker are the only callers, and they authenticate with DATA_SECRETO.
  #
  # The build context is the whole app directory, not ./data: the image bakes in
  # api/src/ontologia.json (the generated forbidden-column list) and Docker
  # cannot COPY from outside its context. Same reason defense/ builds from `.`.
  data:
    build:
      context: .
      dockerfile: data/Dockerfile
    environment:
      DATABASE_URL: postgres://curso:${POSTGRES_PASSWORD:?run scripts/keys.sh first}@db:5432/curso
      # No default, in any environment. data/internal/httpapi refuses to start on
      # a secret under 32 characters or one containing a placeholder word, so
      # there is no value that could be filled in here to make it boot.
      DATA_SECRETO: ${DATA_SECRETO:?run scripts/keys.sh first}
      PORT: "8788"
    depends_on:
      db:
        condition: service_healthy
      # The catalogue's statements name columns. Against an unmigrated schema
      # every one of them fails, so waiting for init is not politeness.
      init:
        condition: service_completed_successfully
    # A scratch image with one static binary has nothing to write and nothing to
    # run. Saying so to the kernel as well costs nothing and removes the rest.
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:4321}
      HOST: 0.0.0.0
      PORT: "8787"
      # The API has no provider credential. It authenticates to the independent
      # payments service and receives only checkout/entitlement contracts.
      PAYMENTS_URL: http://payments:8785
      PAYMENTS_SECRET: ${PAYMENTS_SECRET:?run scripts/keys.sh first}
      MESSAGES_URL: http://messages:8786
      MESSAGES_SECRET: ${MESSAGES_SECRET:?run scripts/keys.sh first}
      NODE_ENV: production
      # No default. A known signing key is a forgeable admin session; compose
      # refuses to start rather than hand out one everybody can read.
      JWT_SECRET: ${JWT_SECRET:?run scripts/keys.sh first}
      # Secreto compartido con el servicio de IA. Sin el, /api/chat responde 501.
      IA_URL: http://ia:8799
      IA_SECRETO: ${IA_SECRETO:?run scripts/keys.sh first}
      # Separate service identity, accepted only by the durable bus-claim route.
      QUEUE_SECRETO: ${QUEUE_SECRETO:?run scripts/keys.sh first}
      # The only database path. API has no DATABASE_URL by construction.
      DATA_URL: http://data:8788
      DATA_SECRETO: ${DATA_SECRETO:?run scripts/keys.sh first}
      AMQP_URL: amqp://app:${RABBITMQ_PASSWORD:?run scripts/keys.sh first}@broker:5672/
    # No command override: the image's CMD is just the server now. Schema and
    # seed belong to the `init` service.
    depends_on:
      # service_completed_successfully, not service_started: the API must not
      # accept traffic against a schema that has not been applied. If init fails,
      # api never starts — which is the correct outcome, loudly.
      init:
        condition: service_completed_successfully
      # service_started only meant "the process was spawned": uvicorn had not
      # bound 8799 yet, so the first /api/chat got a 502 that looked like a chat
      # bug. The ia service already defines a healthcheck — use it.
      ia:
        condition: service_healthy
      data:
        condition: service_healthy
      payments:
        condition: service_healthy
      messages:
        condition: service_healthy
    ports:
      - "${API_HOST_BIND:-0.0.0.0}:${API_HOST_PORT:-8787}:8787"
    # /api/health touches the labs table, so a green answer means: seed finished,
    # migrations applied, the pool works and the port is bound. That is exactly
    # the gate web needs — without it web served pages mid-seed.
    # start_period covers migrate() + the full seed on a fresh volume; failures
    # inside it do not count against retries.
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:8787/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 90s

  ia:
    build: ./ai
    env_file:
      - path: ./ai/.env
        required: false
    environment:
      # El puente de vuelta: la IA pide a la API que ejecute las herramientas,
      # porque la API es la unica que tiene la sesion del usuario.
      NODE_URL: http://api:8787
      IA_SECRETO: ${IA_SECRETO:?run scripts/keys.sh first}
      PORT: "8799"
      # Basta UNA. El orden se fija con PROVEEDOR_ORDEN.
      AMQP_URL: amqp://app:${RABBITMQ_PASSWORD:?run scripts/keys.sh first}@broker:5672/
    # No se publica puerto al host a proposito: solo lo llama la API por la red
    # interna. Es un servicio interno, no una API publica.
    expose:
      - "8799"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:8799/salud')\""]
      interval: 5s
      timeout: 3s
      retries: 10

  # ---------------------------------------------------------------------------
  # The workers. Each runs the SAME IMAGE as its service, with a different
  # command.
  #
  # That is deliberate and it is the point. A worker built from different code
  # than its API is a bug class of its own: the worker's idea of a tool diverges
  # from the API's and nothing detects it until a job produces a wrong answer.
  # Same image, different entrypoint, and that divergence cannot be expressed.
  #
  # Scale these by queue depth. Neither publishes a port; nothing talks to them
  # except the broker.
  # ---------------------------------------------------------------------------
  api-worker:
    build:
      context: .
      dockerfile: api/Dockerfile
    command: ["node", "dist/api/src/worker.js"]
    environment:
      NODE_ENV: production
      JWT_SECRET: ${JWT_SECRET:?run scripts/keys.sh first}
      IA_URL: http://ia:8799
      IA_SECRETO: ${IA_SECRETO:?run scripts/keys.sh first}
      # The worker uses the same closed data catalogue as the HTTP runtime.
      DATA_URL: http://data:8788
      DATA_SECRETO: ${DATA_SECRETO:?run scripts/keys.sh first}
      AMQP_URL: amqp://app:${RABBITMQ_PASSWORD:?run scripts/keys.sh first}@broker:5672/
    depends_on:
      broker:
        condition: service_healthy
      init:
        condition: service_completed_successfully
      data:
        condition: service_healthy
    restart: unless-stopped

  ai-worker:
    build: ./ai
    command: ["python", "-m", "course_ai.worker"]
    env_file:
      - path: ./ai/.env
        required: false
    environment:
      NODE_URL: http://api:8787
      IA_SECRETO: ${IA_SECRETO:?run scripts/keys.sh first}
      AMQP_URL: amqp://app:${RABBITMQ_PASSWORD:?run scripts/keys.sh first}@broker:5672/
    depends_on:
      broker:
        condition: service_healthy
    restart: unless-stopped

  # Owns the RabbitMQ topology: it declares the exchanges, queues and bindings, and
  # observes what is in flight. Nothing routes THROUGH it — that is deliberate, and it
  # is the line that keeps it from becoming the orchestrator this architecture argues
  # against. The test to apply to any future change: if stopping this container would
  # break another service, it has become the orchestrator and the change is wrong.
  queue:
    build: ./queue
    environment:
      AMQP_URL: amqp://app:${RABBITMQ_PASSWORD:?run scripts/keys.sh first}@broker:5672/
      # Queue authenticates as queue, never as the AI service.
      QUEUE_SECRETO: ${QUEUE_SECRETO:?run scripts/keys.sh first}
      APP_ENV: production
      PORT: "8790"
      # The at-most-once claim store. Empty means in-memory claims, which the service
      # reports as a warning on /health rather than hiding: a redelivery after a restart
      # can then run a handler twice. Production is wired to the durable API route.
      BUS_CLAIM_URL: http://api:8787/api/v3/interno/bus/claim
    depends_on:
      broker:
        condition: service_healthy
      api:
        condition: service_healthy
    # Not published, like `ia`. Putting an enqueue endpoint on the host buys nothing —
    # queue/tools/ reaches it from inside the network. If you ever need host curl access,
    # bind 127.0.0.1:8790:8790, never 0.0.0.0.
    expose:
      - "8790"
    # Exec form with no shell, because the image is `scratch`: there is no /bin/sh for
    # CMD-SHELL to run. The binary answers its own healthcheck subcommand.
    healthcheck:
      test: ["CMD", "/queue", "healthcheck"]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 3
    restart: unless-stopped

  web:
    build:
      context: ./web
      args:
        PUBLIC_SITE: ${PUBLIC_SITE:-${PUBLIC_ORIGIN:-http://localhost:4321}}
    environment:
      API_URL: http://api:8787
      HOST: 0.0.0.0
      PORT: "4321"
      MP_PUBLIC_KEY: ${MP_PUBLIC_KEY:-}
      PUBLIC_SITE: ${PUBLIC_SITE:-${PUBLIC_ORIGIN:-http://localhost:4321}}
    depends_on:
      # Was a bare `- api`, i.e. service_started: web accepted traffic while the
      # api was still seeding, and every page that reads the session got a
      # connection refused. Chain is db -> ia -> api -> web, no cycle.
      api:
        condition: service_healthy
    ports:
      - "${WEB_HOST_BIND:-0.0.0.0}:${WEB_HOST_PORT:-4321}:4321"
    # /robots.txt is server-rendered but talks to nothing: it proves the Astro
    # node server is answering without making web's health depend on the api a
    # second time (depends_on already does that).
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:4321/robots.txt').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s

  # -------------------------------------------------------------------------
  # THE FIVE LINES OF DEFENCE
  #
  # One image, five commands. They share `defense/Dockerfile` because they share
  # every package; the binary is chosen per service, which is why that image has
  # no ENTRYPOINT.
  #
  # WHAT THEY ALL HAVE IN COMMON, and why each item is here:
  #   cap_drop: ALL          none of them needs a capability. cmd/smith reports
  #                          any that appears, so this is asserted at runtime.
  #   read_only: true        a writable rootfs is what turns one file-write bug
  #                          into something that survives a restart.
  #   no-new-privileges      a setuid binary in a future layer cannot escalate.
  #   no docker.sock         the socket is root on the host. Quarantining a
  #                          container is therefore an ESCALATION here, not an
  #                          action -- see policy.QuarantineContainer.
  #   DEFENSE_MODE=propose   the default. Nothing is applied until somebody sets
  #                          enforce deliberately, per agent.
  #
  # They deliberately have NO DATABASE_URL and NO JWT_SECRET. Neo revokes a
  # session by publishing on the bus and letting the api do it with its own
  # credentials: the agent with the power holds the fewest keys.
  # -------------------------------------------------------------------------

  # Line 1 -- the door. Needs the HOST network namespace, because from inside its
  # own it can only see its own sockets, and a clean result from there would mean
  # nothing at all. Read-only and capability-free even so.
  morpheus:
    build:
      context: .
      dockerfile: defense/Dockerfile
    command: ["/morpheus"]
    network_mode: host
    environment:
      APP_ENV: production
      # Host networking has no Compose DNS. broker publishes AMQP only on
      # loopback, so this agent can report without exposing AMQP to the LAN.
      AMQP_URL: amqp://app:${RABBITMQ_PASSWORD:?run scripts/keys.sh first}@127.0.0.1:5672/
      DEFENSE_MODE: propose
      DEFENSE_SCAN_EVERY: 15m
      DEFENSE_AUDIT: /var/lib/defense/audit.jsonl
    volumes:
      - defenseaudit:/var/lib/defense
    depends_on:
      broker:
        condition: service_healthy
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

  # Line 2 -- the walls. Reads sshd_config and /proc from the host, READ ONLY. It
  # never applies anything: `docker compose run --rm --entrypoint /trinity
  # defense-trinity nft` prints the ruleset for a human to review and apply.
  trinity:
    build:
      context: .
      dockerfile: defense/Dockerfile
    command: ["/trinity"]
    environment:
      APP_ENV: production
      AMQP_URL: amqp://app:${RABBITMQ_PASSWORD:?run scripts/keys.sh first}@broker:5672/
      DEFENSE_MODE: propose
      DEFENSE_SCAN_EVERY: 30m
      DEFENSE_AUDIT: /var/lib/defense/audit.jsonl
    volumes:
      - defenseaudit:/var/lib/defense
      # :ro is the whole point. Trinity reports on the host's configuration and
      # must not be able to change it.
      - /etc/ssh/sshd_config:/etc/ssh/sshd_config:ro
      - /etc/apt/apt.conf.d:/etc/apt/apt.conf.d:ro
    depends_on:
      broker:
        condition: service_healthy
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

  # Line 3 -- the adversary. Deliberately the least privileged thing in this file:
  # it asks "if somebody is already in here, what do they get", and the answer has
  # to be "nothing", so it gets nothing.
  smith:
    build:
      context: .
      dockerfile: defense/Dockerfile
    command: ["/smith"]
    environment:
      APP_ENV: production
      AMQP_URL: amqp://app:${RABBITMQ_PASSWORD:?run scripts/keys.sh first}@broker:5672/
      DEFENSE_MODE: propose
      DEFENSE_SCAN_EVERY: 1h
      DEFENSE_AUDIT: /var/lib/defense/audit.jsonl
    volumes:
      - defenseaudit:/var/lib/defense
    depends_on:
      broker:
        condition: service_healthy
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

  # Line 4 -- it sees. Consumes defense.signal.* and publishes scored threats.
  # No policy engine, no guard: internal/guard's test asserts that no package
  # outside itself can start a process, so this is structural, not a promise.
  oracle:
    build:
      context: .
      dockerfile: defense/Dockerfile
    command: ["/oracle"]
    environment:
      APP_ENV: production
      AMQP_URL: amqp://app:${RABBITMQ_PASSWORD:?run scripts/keys.sh first}@broker:5672/
      DEFENSE_MODE: propose
      DEFENSE_WATCH_WINDOW: 5m
      DEFENSE_AUDIT: /var/lib/defense/audit.jsonl
    volumes:
      - defenseaudit:/var/lib/defense
    depends_on:
      broker:
        condition: service_healthy
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

  # Line 5 -- the only one that may act, and it starts unable to.
  #
  # DEFENSE_MODE stays `propose` until the thresholds in cmd/oracle have been
  # watched against real traffic. Flipping it to `enforce` is a deliberate,
  # documented act: see defense/README.md. Even then the ceiling is ten
  # reversible, self-expiring actions per ten minutes, from a closed
  # allowlist, none of which can touch cloudflared, db, broker or mosquitto.
  neo:
    build:
      context: .
      dockerfile: defense/Dockerfile
    command: ["/neo"]
    environment:
      APP_ENV: production
      AMQP_URL: amqp://app:${RABBITMQ_PASSWORD:?run scripts/keys.sh first}@broker:5672/
      DEFENSE_MODE: ${DEFENSE_MODE:-propose}
      DEFENSE_AUDIT: /var/lib/defense/audit.jsonl
      # Absent is a supported state: without them an edge block escalates
      # instead of happening, and Neo says so in the escalation.
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}
      CLOUDFLARE_ZONE_ID: ${CLOUDFLARE_ZONE_ID:-}
    volumes:
      - defenseaudit:/var/lib/defense
    depends_on:
      broker:
        condition: service_healthy
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

volumes:
  pgdata:
  paymentsdata:
  messagesdata:
  brokerdata:
  # The audit log. A named volume rather than a bind mount so it survives
  # `docker compose down` -- the records worth having are the ones written just
  # before something went wrong, and those are exactly the ones a recreate would
  # take with it.
  defenseaudit:
