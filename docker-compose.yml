# Cuatro contenedores: base, IA, backend y frontend. Un solo comando:
#   docker compose up --build
#
# La IA es un servicio aparte desde v3: el bucle del agente y la ontologia estan
# en Python (ai/). Las llaves de modelo las tiene ESE contenedor, no la API — asi
# el proceso que habla con internet no es el que tiene la base delante.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: curso
      POSTGRES_PASSWORD: curso
      POSTGRES_DB: curso
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"          # para conectarte desde la máquina, no lo necesita el resto
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U curso -d curso"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: ./api
    environment:
      DATABASE_URL: postgres://curso:curso@db:5432/curso
      WEB_ORIGIN: http://localhost:4321
      HOST: 0.0.0.0
      PORT: "8787"
      # Sin estas dos el checkout responde 501 en vez de fingir un pago.
      MP_ACCESS_TOKEN: ${MP_ACCESS_TOKEN:-}
      MP_WEBHOOK_SECRET: ${MP_WEBHOOK_SECRET:-}
      MP_PUBLIC_KEY: ${MP_PUBLIC_KEY:-}
      JWT_SECRET: ${JWT_SECRET:-dev-solo-para-local}
      # Secreto compartido con el servicio de IA. Sin el, /api/chat responde 501.
      IA_URL: http://ia:8799
      IA_SECRETO: ${IA_SECRETO:-dev-solo-para-local}
    # La siembra es idempotente: actualiza lecciones y labs sin borrar intentos.
    command: sh -c "node src/seed.js && node src/server.js"
    depends_on:
      db:
        condition: service_healthy
      ia:
        condition: service_started
    ports:
      - "8787:8787"

  ia:
    build: ./ai
    environment:
      # El puente de vuelta: la IA pide a la API que ejecute las herramientas,
      # porque la API es la unica que tiene la sesion del usuario.
      NODE_URL: http://api:8787
      IA_SECRETO: ${IA_SECRETO:-dev-solo-para-local}
      PORT: "8799"
      # Basta UNA. El orden se fija con PROVEEDOR_ORDEN.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      KIMI_API_KEY: ${KIMI_API_KEY:-}
      HF_TOKEN: ${HF_TOKEN:-}
      OPENCODE_API_KEY: ${OPENCODE_API_KEY:-}
      PROVEEDOR_ORDEN: ${PROVEEDOR_ORDEN:-}
    # No se publica puerto al host a proposito: solo lo llama la API por la red
    # interna. Es un servicio interno, no una API publica.
    expose:
      - "8799"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:8799/salud')\""]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build: ./web
    environment:
      API_URL: http://api:8787
      HOST: 0.0.0.0
      PORT: "4321"
      MP_PUBLIC_KEY: ${MP_PUBLIC_KEY:-}
    depends_on:
      - api
    ports:
      - "4321:4321"

volumes:
  pgdata:
