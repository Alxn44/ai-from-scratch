# The normal road: a pull request into main, then main deploys.
#
# Nothing here duplicates ci.yml. It CALLS it, so the gates that guard a pull
# request are the same objects that guard a deploy — a deploy pipeline with its
# own slightly different copy of the checks is a pipeline that will eventually
# ship something the PR gate would have caught.
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      reason:
        description: Why are you deploying by hand?
        required: true

# One deploy at a time, and never cancel one in flight. Cancelling a half-pushed
# set of images leaves the registry holding a mix of two commits.
concurrency:
  group: deploy-main
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  gates:
    name: gates
    uses: ./.github/workflows/ci.yml

  publish:
    name: publish images
    needs: gates
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The immutable tag is the commit. `latest` is a convenience that moves;
      # the sha is what you roll back to, so it is the one that must always exist.
      - name: Tag
        id: meta
      # GHCR EXIGE MINUSCULAS EN EL NOMBRE DEL REPOSITORIO, y el dueno de este
      # se escribe Alxn44. Usar github.repository tal cual producia
      #   invalid tag "ghcr.io/Alxn44/ai-from-scratch/api:...":
      #   repository name must be lowercase
      # y mataba `publish images` DESPUES de que las cinco puertas pasaran en
      # verde. Nunca se habia visto porque el despliegue jamas habia corrido.
        run: |
          echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          echo "repo=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      # PLATFORMS: linux/amd64 AND linux/arm64, on every image below.
      #
      # The deploy target is a Raspberry Pi 4B, which is arm64. Every one of these
      # steps used to build on ubuntu-latest and publish amd64 only, so
      # `docker compose pull && up` on the Pi would have failed every service with
      # `exec format error` -- after CI went green, after the images were pushed,
      # at the last possible moment.
      #
      # The cost is honest and unequal:
      #   - queue and security are Go and CROSS-compile (see their Dockerfiles),
      #     so arm64 costs them almost nothing.
      #   - api, ai and web install dependencies for the target architecture, so
      #     their arm64 halves run under QEMU and take materially longer. The gha
      #     cache below is what keeps that bearable; the first build after a
      #     lockfile change is the slow one.
      #
      # amd64 is kept alongside it rather than dropped: CI's `images` job builds
      # on amd64, and developer machines are a mix. A single-arch arm64 publish
      # would make every local `docker compose pull` fail instead.
      # CONTEXTO PADRE, no app_ai_from_scratch/api. Desde la extraccion
      # (e729418) el Dockerfile hace `COPY auth /app/auth` y `COPY package.json
      # /app/package.json`, y ninguno de los dos esta dentro de api/. Con el
      # contexto estrecho buildx muere en Dockerfile:66 con
      #   failed to calculate checksum of ref ...: "/api/pnpm-lock.yaml": not found
      # y como `api` es el primer paso, los otros ocho quedan en skipped.
      #
      # docker-compose.yml ya declara `context: .` con `dockerfile: api/Dockerfile`,
      # asi que CI (que hace `docker compose build`) siempre construyo bien y esta
      # deriva solo vivia aqui. .dockerignore es un allowlist y ya trae api/src,
      # api/prisma, api/package.json, api/pnpm-lock.yaml, api/tsconfig.json,
      # el package.json de la raiz y auth/.
      - name: api
        uses: docker/build-push-action@v6
        with:
          context: app_ai_from_scratch
          file: app_ai_from_scratch/api/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ steps.meta.outputs.repo }}/api:${{ steps.meta.outputs.tag }}
            ghcr.io/${{ steps.meta.outputs.repo }}/api:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      # The migrate stage, published as its own image. The runtime stage installs
      # with --prod and prunes the Prisma CLI, so the container that applies
      # migrations cannot be the container that serves traffic.
      - name: api-migrate
        uses: docker/build-push-action@v6
        with:
          context: app_ai_from_scratch
          file: app_ai_from_scratch/api/Dockerfile
          target: migrate
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ steps.meta.outputs.repo }}/api-migrate:${{ steps.meta.outputs.tag }}
            ghcr.io/${{ steps.meta.outputs.repo }}/api-migrate:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api-migrate,mode=max

      - name: ai
        uses: docker/build-push-action@v6
        with:
          context: app_ai_from_scratch/ai
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ steps.meta.outputs.repo }}/ai:${{ steps.meta.outputs.tag }}
            ghcr.io/${{ steps.meta.outputs.repo }}/ai:latest
          cache-from: type=gha,scope=ai
          cache-to: type=gha,scope=ai,mode=max

      - name: web
        uses: docker/build-push-action@v6
        with:
          context: app_ai_from_scratch/web
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ steps.meta.outputs.repo }}/web:${{ steps.meta.outputs.tag }}
            ghcr.io/${{ steps.meta.outputs.repo }}/web:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

      - name: Is there a queue service yet?
        id: queue
        run: |
          if [ -f app_ai_from_scratch/queue/Dockerfile ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: queue
        if: steps.queue.outputs.found == 'true'
        uses: docker/build-push-action@v6
        with:
          context: app_ai_from_scratch/queue
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ steps.meta.outputs.repo }}/queue:${{ steps.meta.outputs.tag }}
            ghcr.io/${{ steps.meta.outputs.repo }}/queue:latest
          cache-from: type=gha,scope=queue
          cache-to: type=gha,scope=queue,mode=max

      - name: Is there a security service yet?
        id: security
        run: |
          if [ -f app_ai_from_scratch/security/Dockerfile ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      # ONE image, five agents. The context is app_ai_from_scratch and not
      # app_ai_from_scratch/security, because security imports the bus envelope and
      # the broker from queue through a replace directive and Docker cannot COPY
      # from outside its context. app_ai_from_scratch/.dockerignore is an
      # allowlist that keeps that context to the four directories involved.
      - name: security
        if: steps.security.outputs.found == 'true'
        uses: docker/build-push-action@v6
        with:
          context: app_ai_from_scratch
          file: app_ai_from_scratch/security/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ steps.meta.outputs.repo }}/security:${{ steps.meta.outputs.tag }}
            ghcr.io/${{ steps.meta.outputs.repo }}/security:latest
          cache-from: type=gha,scope=security
          cache-to: type=gha,scope=security,mode=max

      - name: Is there a data service yet?
        id: data
        run: |
          if [ -f app_ai_from_scratch/data/Dockerfile ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      # Context is app_ai_from_scratch, not app_ai_from_scratch/data: this image
      # bakes in api/src/ontologia.json -- the generated forbidden-column list --
      # and Docker cannot COPY from outside its context. Baked rather than mounted
      # so the running service checks against the same bytes the build proved.
      #
      # The Dockerfile runs `go test ./...` in a stage of its own, on the
      # BUILDER's architecture, because a cross-compiled arm64 test binary cannot
      # execute on an amd64 runner. That is why the arm64 leg is cross-compiled
      # rather than emulated: QEMU costs tens of minutes to reach the same answer.
      - name: data
        if: steps.data.outputs.found == 'true'
        uses: docker/build-push-action@v6
        with:
          context: app_ai_from_scratch
          file: app_ai_from_scratch/data/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ steps.meta.outputs.repo }}/data:${{ steps.meta.outputs.tag }}
            ghcr.io/${{ steps.meta.outputs.repo }}/data:latest
          cache-from: type=gha,scope=data
          cache-to: type=gha,scope=data,mode=max

      # payments and messages arrived with the extraction (e729418) and nobody
      # added them here, while docker-compose.prod.yml:58 and :65 started pulling
      # them. Nothing caught it because DEPLOY_TARGET was unset: the release job
      # refused before it ever ran `compose pull`. The first deploy with a target
      # configured would have died on the host with `manifest unknown` for
      # ghcr.io/<repo>/payments -- after CI went green and after the other seven
      # images had already been published.
      #
      # Context is the service directory, unlike data and security above: both
      # Dockerfiles COPY only from their own tree, which is also what compose
      # declares (`build: ./payments`). A wider context here would upload the
      # monorepo to the daemon for nothing.
      - name: payments
        uses: docker/build-push-action@v6
        with:
          context: app_ai_from_scratch/payments
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ steps.meta.outputs.repo }}/payments:${{ steps.meta.outputs.tag }}
            ghcr.io/${{ steps.meta.outputs.repo }}/payments:latest
          cache-from: type=gha,scope=payments
          cache-to: type=gha,scope=payments,mode=max

      - name: messages
        uses: docker/build-push-action@v6
        with:
          context: app_ai_from_scratch/messages
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ steps.meta.outputs.repo }}/messages:${{ steps.meta.outputs.tag }}
            ghcr.io/${{ steps.meta.outputs.repo }}/messages:latest
          cache-from: type=gha,scope=messages
          cache-to: type=gha,scope=messages,mode=max

  release:
    name: release
    needs: publish
    # Only when there is somewhere to deploy TO. Without this guard the job runs
    # release.yml, which refuses on an unset DEPLOY_TARGET and exits 1 -- correct
    # in itself, but it painted main permanently red on a repository that has
    # never had the deploy configured. A red that is always red stops being a
    # signal: after a week nobody can tell "red because no automated deploy" from
    # "red because something broke", which is the failure the red was supposed to
    # prevent. The step in release.yml stays exactly as it is -- it still guards
    # hotfix.yml and any other caller.
    if: vars.DEPLOY_TARGET != ''
    # One deploy script, in release.yml, called by both this and hotfix.yml.
    # Two copies would drift, and the hotfix copy is the one that runs while
    # production is already broken and nobody is reading it carefully.
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.publish.outputs.tag }}
    secrets: inherit

  # The other half of the guard above, and the reason turning the red off is not
  # the same as hiding it. A skipped job is easy to miss, so this one RUNS, and
  # its name is what the checks list shows next to the commit. Green pipeline,
  # and the line still reads NOT DEPLOYED.
  no-release:
    name: NOT DEPLOYED - deploy by hand
    needs: publish
    if: vars.DEPLOY_TARGET == ''
    runs-on: ubuntu-latest
    steps:
      - name: State that the images are published and nothing was deployed
        env:
          TAG: ${{ needs.publish.outputs.tag }}
        run: |
          set -euo pipefail
          repo="${GITHUB_REPOSITORY,,}"
          {
            echo "## Images published. Nothing was deployed."
            echo
            echo "\`DEPLOY_TARGET\` is not set on this repository, so there is no host to"
            echo "release to. The images for this commit ARE in the registry, pinned:"
            echo
            echo '```'
            echo "TAG=$TAG"
            echo "IMAGE_REPO=ghcr.io/$repo"
            echo '```'
            echo
            echo "### Deploy it by hand"
            echo
            echo '```sh'
            echo "cd \$DEPLOY_PATH"
            echo "sed -i 's/^TAG=.*/TAG=$TAG/' .env"
            echo "docker compose -f docker-compose.yml -f docker-compose.prod.yml pull"
            echo "docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --no-build --wait"
            echo '```'
            echo
            echo "### Or turn the automated deploy on"
            echo
            echo "Set the repository **variable** \`DEPLOY_TARGET\` to the host name, and add"
            echo "these **Environment secrets** on \`production\`:"
            echo
            echo "    DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_KEY DEPLOY_PATH"
            echo "    WEB_ORIGIN POSTGRES_PASSWORD RABBITMQ_PASSWORD JWT_SECRET IA_SECRETO"
            echo "    DATA_SECRETO QUEUE_SECRETO PAYMENTS_SECRET PAYMENTS_DB_PASSWORD"
            echo "    MESSAGES_SECRET MESSAGES_DB_PASSWORD"
            echo
            echo "Optional: \`DEPLOY_PORT\`, \`MP_ACCESS_TOKEN\`, \`MP_WEBHOOK_SECRET\`, \`MP_PUBLIC_KEY\`."
            echo
            echo "A GitHub-hosted runner has to be able to REACH the host. This one sits"
            echo "behind CGNAT, so that means putting the runner on the tailnet first (or"
            echo "a self-hosted runner on the box). Setting the secrets alone is not enough."
          } >> "$GITHUB_STEP_SUMMARY"

          echo "::warning title=Not deployed::Images for $TAG are published; no DEPLOY_TARGET is configured, so no host was updated."

